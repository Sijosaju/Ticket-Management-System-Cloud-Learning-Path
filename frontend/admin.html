<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin dashboard</title><link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Admin dashboard</h1>
    <div id="message"></div>

    <form id="eventForm">
      <div class="row"><h2 id="eventFormTitle">Create event</h2><button id="cancelEdit" class="hidden" type="button" onclick="resetEventForm()">Cancel edit</button></div>
      <div class="row">
        <p><label>Title</label><input name="title" required></p>
        <p><label>Category</label><input name="category" required></p>
        <p><label>Location</label><input name="location" required></p>
      </div>
      <div class="row">
        <p><label>Date</label><input name="event_date" type="date" required></p>
        <p><label>Time</label><input name="event_time" type="time" required></p>
        <p><label>Image URL (optional)</label><input name="image_url"></p>
      </div>
      <label>Description</label><textarea name="description" required></textarea>
      <p><button id="eventSubmit">Create event</button></p>
    </form>

    <h2>Event management</h2>
    <section id="events" class="grid"></section>

    <form id="ticketForm">
      <h2>Create ticket type</h2>
      <div class="row">
        <p><label>Event</label><select id="ticketEvent" required></select></p>
        <p><label>Ticket name</label><input name="name" placeholder="General Admission" required></p>
        <p><label>Price</label><input name="price" type="number" min="0" step="0.01" required></p>
        <p><label>Total quantity</label><input name="total_quantity" type="number" min="0" required></p>
      </div>
      <label>Description (optional)</label><textarea name="description"></textarea>
      <p><button>Create ticket type</button></p>
    </form>

    <h2 id="ticketsTitle">Tickets</h2>
    <section id="tickets" class="grid"><p class="muted">Choose an event above to view its ticket types.</p></section>

    <h2>All bookings</h2>
    <section id="bookings" class="grid"></section>
  </main>
  <script src="js/app.js"></script>
  <script>
    if (!user() || user().role !== 'admin') location = 'login.html';
    let editingEventId = null;

    function payload(form) { return Object.fromEntries(new FormData(form)); }
    function resetEventForm() {
      editingEventId = null; eventForm.reset();
      eventFormTitle.textContent = 'Create event'; eventSubmit.textContent = 'Create event';
      cancelEdit.classList.add('hidden');
    }

    eventForm.onsubmit = async event => {
      event.preventDefault();
      try {
        const path = editingEventId ? '/events/' + editingEventId : '/events';
        const method = editingEventId ? 'PUT' : 'POST';
        await api(path, {method, body: JSON.stringify(payload(eventForm))});
        resetEventForm(); await load();
      } catch (error) { showError(error); }
    };

    async function editEvent(id) {
      try {
        const event = (await api('/events/' + id)).event;
        editingEventId = id;
        for (const key of ['title','category','location','event_date','event_time','image_url','description']) eventForm.elements[key].value = event[key] || '';
        eventFormTitle.textContent = 'Edit event'; eventSubmit.textContent = 'Save changes';
        cancelEdit.classList.remove('hidden'); eventForm.scrollIntoView({behavior:'smooth'});
      } catch (error) { showError(error); }
    }

    async function cancelEvent(id) {
      if (!confirm('Cancel this event? It will no longer be available for new bookings.')) return;
      try { await api('/events/' + id, {method:'DELETE'}); await load(); } catch (error) { showError(error); }
    }

    ticketForm.onsubmit = async event => {
      event.preventDefault();
      try {
        const eventId = ticketEvent.value;
        await api('/events/' + eventId + '/tickets', {method:'POST', body:JSON.stringify(payload(ticketForm))});
        ticketForm.reset(); ticketEvent.value = eventId; await loadTickets(eventId); await load();
      } catch (error) { showError(error); }
    };

    ticketEvent.onchange = () => loadTickets(ticketEvent.value);
    async function loadTickets(eventId) {
      if (!eventId) return;
      try {
        const event = (await api('/events/' + eventId)).event;
        ticketsTitle.textContent = 'Tickets — ' + event.title;
        tickets.innerHTML = event.ticket_types.map(ticket => `
          <form class="card" onsubmit="updateTicket(event, ${event.id}, ${ticket.id}, this)">
            <h3>Edit ${ticket.name}</h3>
            <label>Name</label><input name="name" value="${ticket.name}" required>
            <label>Description</label><input name="description" value="${ticket.description || ''}">
            <div class="row"><p><label>Price</label><input name="price" type="number" min="0" step="0.01" value="${ticket.price}" required></p><p><label>Total quantity</label><input name="total_quantity" type="number" min="0" value="${ticket.total_quantity}" required></p></div>
            <p class="muted">Available: ${ticket.available_quantity}</p><button>Save ticket</button>
          </form>`).join('') || '<p class="muted">No ticket types for this event yet.</p>';
      } catch (error) { showError(error); }
    }

    async function updateTicket(event, eventId, ticketId, form) {
      event.preventDefault();
      try { await api('/events/' + eventId + '/tickets/' + ticketId, {method:'PUT', body:JSON.stringify(payload(form))}); await loadTickets(eventId); }
      catch (error) { showError(error); }
    }

    async function load() {
      try {
        const allEvents = (await api('/events')).events;
        ticketEvent.innerHTML = allEvents.map(event => `<option value="${event.id}">${event.title}</option>`).join('');
        events.innerHTML = allEvents.map(event => `<article class="card"><h3>${event.title}</h3><p class="muted">${event.event_date} · ${event.location}</p><p>Status: ${event.status}</p><button onclick="editEvent(${event.id})">Edit</button> <button class="danger" onclick="cancelEvent(${event.id})">Cancel event</button> <p><button onclick="ticketEvent.value=${event.id};loadTickets(${event.id})">Manage tickets</button></p></article>`).join('') || '<p>No events yet.</p>';
        const allBookings = (await api('/bookings')).bookings;
        bookings.innerHTML = allBookings.map(booking => `<article class="card"><b>${booking.event.title}</b><p>${booking.event.location} · $${booking.total_amount.toFixed(2)}</p><p>${booking.status}</p></article>`).join('') || '<p>No bookings yet.</p>';
        if (ticketEvent.value) await loadTickets(ticketEvent.value);
      } catch (error) { showError(error); }
    }
    load();
  </script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><h1>Admin dashboard</h1><div id="message"></div><form id="form"><h2>Create event</h2><div class="row"><p><label>Title</label><input name="title" required></p><p><label>Category</label><input name="category" required></p><p><label>Location</label><input name="location" required></p></div><div class="row"><p><label>Date</label><input name="event_date" type="date" required></p><p><label>Time</label><input name="event_time" type="time" required></p><p><label>Image URL (optional)</label><input name="image_url"></p></div><label>Description</label><textarea name="description" required></textarea><p><button>Create event</button></p></form><h2>All bookings</h2><section id="bookings" class="grid"></section></main><script src="js/app.js"></script><script>if(!user()||user().role!=='admin')location='login.html';form.onsubmit=async e=>{e.preventDefault();try{await api('/events',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();load()}catch(e){showError(e)}};async function load(){try{bookings.innerHTML=(await api('/bookings')).bookings.map(b=>`<article class="card"><b>${b.event.title}</b><p>${b.event.location} · $${b.total_amount.toFixed(2)}</p><p>${b.status}</p></article>`).join('')||'<p>No bookings yet.</p>'}catch(e){showError(e)}}load()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event details</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><div id="message"></div><section id="detail" class="card"></section></main><script src="js/app.js"></script><script>const id=new URLSearchParams(location.search).get('id');async function load(){try{const e=(await api('/events/'+id)).event;detail.innerHTML=`<h1>${e.title}</h1><p class="muted">${e.category} · ${e.event_date} at ${e.event_time}</p><p>${e.location}</p><p>${e.description}</p><h2>Tickets</h2>${e.ticket_types.map(t=>`<div class="ticket"><b>${t.name}</b> — $${t.price.toFixed(2)} <span class="muted">(${t.available_quantity} left)</span><input class="qty" data-id="${t.id}" type="number" min="0" max="${t.available_quantity}" value="0"></div>`).join('')||'<p class="muted">Tickets are not available for this event yet.</p>'}<p><button onclick="book()">Book selected tickets</button></p>`}catch(e){showError(e)}}async function book(){if(!token()){location='login.html';return}let items=[...document.querySelectorAll('.qty')].map(x=>({ticket_type_id:+x.dataset.id,quantity:+x.value})).filter(x=>x.quantity>0);if(!items.length){showError({message:'Choose at least one ticket quantity before booking.'});return}try{await api('/bookings',{method:'POST',body:JSON.stringify({event_id:+id,items})});location='bookings.html'}catch(e){showError(e)}}load()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><h1>Login</h1><div id="message"></div><form id="form"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><p><button>Login</button></p><p class="muted">New here? <a href="register.html">Register</a></p></form></main><script src="js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(form));let r=await api('/auth/login',{method:'POST',body:JSON.stringify(d)});localStorage.setItem('token',r.access_token);localStorage.setItem('user',JSON.stringify(r.user));location='events.html'}catch(e){showError(e)}}</script></body></html>

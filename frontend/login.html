<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Ticketly</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="auth-wrap">
      <div class="auth-header">
        <h1>Welcome back.</h1>
        <p>Log in to manage your bookings.</p>
      </div>
      <div id="message"></div>
      <form id="form">
        <label>Email address</label>
        <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label>Password</label>
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <div style="margin-top:1.75rem">
          <button style="width:100%;border-radius:var(--radius-sm);padding:.85rem">Log in →</button>
        </div>
        <p style="text-align:center;margin-top:1.25rem;font-size:.88rem;color:var(--muted)">
          New here? <a href="register.html" style="font-weight:600">Create an account</a>
        </p>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    document.querySelector('#form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      try {
        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify(fd) });
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.user));
        location.href = 'events.html';
      } catch(err) { showError(err); }
    });
  </script>
</body>
</html>

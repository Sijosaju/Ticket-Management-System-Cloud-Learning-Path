<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My bookings</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><h1>My bookings</h1><div id="message"></div><section id="list" class="grid"></section></main><script src="js/app.js"></script><script>async function load(){if(!token()){location='login.html';return}try{let b=(await api('/bookings')).bookings;list.innerHTML=b.map(x=>`<article class="card"><h3>${x.event.title}</h3><p>${x.items.map(i=>`${i.quantity} × ${i.ticket_type}`).join(', ')}</p><p><b>$${x.total_amount.toFixed(2)}</b> · ${x.status}</p>${x.status==='confirmed'?`<button class="danger" onclick="cancel(${x.id})">Cancel booking</button>`:''}</article>`).join('')||'<p>No bookings yet.</p>'}catch(e){showError(e)}}async function cancel(id){try{await api('/bookings/'+id+'/cancel',{method:'POST'});load()}catch(e){showError(e)}}load()</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up — Ticketly</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="auth-wrap">
      <div class="auth-header">
        <h1>Create account.</h1>
        <p>Join thousands booking events they love.</p>
      </div>
      <div id="message"></div>
      <form id="form">
        <label>Full name</label>
        <input name="name" autocomplete="name" required placeholder="Jane Smith">
        <label>Email address</label>
        <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label>Password</label>
        <input name="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Min. 6 characters">
        <div style="margin-top:1.75rem">
          <button style="width:100%;border-radius:var(--radius-sm);padding:.85rem">Create account →</button>
        </div>
        <p style="text-align:center;margin-top:1.25rem;font-size:.88rem;color:var(--muted)">
          Already have an account? <a href="login.html" style="font-weight:600">Log in</a>
        </p>
      </form>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    document.querySelector('#form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      try {
        await api('/auth/register', { method: 'POST', body: JSON.stringify(fd) });
        location.href = 'login.html';
      } catch(err) { showError(err); }
    });
  </script>
</body>
</html>

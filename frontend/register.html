<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><h1>Create account</h1><div id="message"></div><form id="form"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="6" required><p><button>Register</button></p></form></main><script src="js/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await api('/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='login.html'}catch(e){showError(e)}}</script></body></html>

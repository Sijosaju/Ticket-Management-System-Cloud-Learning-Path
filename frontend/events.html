<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Events — Ticketly</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1 style="margin-bottom:1.75rem">Explore events</h1>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" placeholder="Search events, artists, venues…" style="flex:2">
      <input id="category" placeholder="Category" style="max-width:200px">
      <button onclick="load()" class="button btn-dark" style="border-radius:100px">Search</button>
    </div>

    <!-- Category pills -->
    <div class="category-strip" id="catStrip">
      <span class="cat-pill active" data-cat="">All</span>
      <span class="cat-pill" data-cat="Music">🎵 Music</span>
      <span class="cat-pill" data-cat="Sports">⚽ Sports</span>
      <span class="cat-pill" data-cat="Tech">💻 Tech</span>
      <span class="cat-pill" data-cat="Food">🍔 Food</span>
      <span class="cat-pill" data-cat="Art">🎨 Art</span>
      <span class="cat-pill" data-cat="Comedy">😂 Comedy</span>
    </div>

    <div id="message"></div>
    <section id="events" class="grid">
      <p class="muted">Loading events…</p>
    </section>
  </main>
  <script src="js/config.js"></script>
<script src="js/app.js"></script>
  <script>
    async function load() {
      const q = document.querySelector('#search').value.trim();
      const c = document.querySelector('#category').value.trim();
      let path = '/events?x=1';
      if (q) path += `&search=${encodeURIComponent(q)}`;
      if (c) path += `&category=${encodeURIComponent(c)}`;
      const el = document.querySelector('#events');
      el.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const { events } = await api(path);
        if (!events.length) {
          el.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>No events found</h3><p>Try a different search or category.</p></div>`;
          return;
        }
        el.innerHTML = events.map(e => eventCard(e)).join('');
      } catch(e) { showError(e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      load();
      document.querySelector('#search').addEventListener('keydown', e => e.key === 'Enter' && load());
      document.querySelector('#category').addEventListener('keydown', e => e.key === 'Enter' && load());

      document.querySelector('#catStrip').addEventListener('click', e => {
        const pill = e.target.closest('.cat-pill');
        if (!pill) return;
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        document.querySelector('#category').value = pill.dataset.cat;
        load();
      });
    });
  </script>
</body>
</html>

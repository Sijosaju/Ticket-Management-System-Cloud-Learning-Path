<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Events</title><link rel="stylesheet" href="css/styles.css"></head><body><nav id="nav"></nav><main><h1>Events</h1><div class="row"><input id="search" placeholder="Search events"><input id="category" placeholder="Filter by category"><button onclick="load()">Search</button></div><div id="message"></div><section id="events" class="grid"></section></main><script src="js/app.js"></script><script>async function load(){try{let q=`?search=${encodeURIComponent(search.value)}&category=${encodeURIComponent(category.value)}`;events.innerHTML=(await api('/events'+q)).events.map(eventCard).join('')||'<p>No events found.</p>'}catch(e){showError(e)}}load()</script></body></html>
